<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erian Academy — La Escuela en Línea de Élite</title>
<meta name="description" content="La primera Escuela 100% en Línea y de Élite en Barinas. Aprende inglés con IA y domina las carreras del futuro desde tu campus virtual.">
<style>
  :root {
    --bg-main: #0b1320;       
    --bg-card: #111c2e;       
    --bg-maroon: #3b1616;     
    --gold: #dfb646;          
    --cyan: #38bdf8;          
    --coral: #fda4af;         
    --binance-yellow: #F0B90B;
    --text-main: #e2e8f0;     
    --text-muted: #94a3b8;    
    --glass: rgba(255,255,255,0.03);
    --border-glass: rgba(255,255,255,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background-color: var(--bg-main); 
    color: var(--text-main);
    overflow-x: hidden; line-height: 1.7;
    background-image: 
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 50px 50px;
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    padding: 15px 20px;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(11, 19, 32, 0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-glass);
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
  .logo-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--gold); color: var(--bg-main);
    display: grid; place-items: center; font-size: 15px; font-weight: 900;
  }
  .header-cta {
    padding: 8px 14px; border-radius: 8px;
    background: transparent; border: 1px solid var(--gold);
    color: var(--gold); font-weight: 600; text-decoration: none; font-size: 12px;
    transition: all 0.3s; white-space: nowrap;
  }
  .header-cta:hover { background: var(--gold); color: var(--bg-main); }

  /* HERO */
  .hero { padding: 60px 20px; text-align: center; max-width: 900px; margin: 0 auto; position: relative; }
  .flag-container { display: flex; justify-content: center; align-items: center; margin-bottom: 25px; perspective: 1000px; }
  .flag-3d {
    width: 152px; height: 80px; border-radius: 4px; overflow: hidden;
    box-shadow: -10px 15px 25px rgba(0,0,0,0.6), 0 0 20px rgba(255,255,255,0.1);
    animation: waveFlag 5s ease-in-out infinite alternate; transform-style: preserve-3d; position: relative;
  }
  .flag-3d::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,0.3) 0%, rgba(255,255,255,0.1) 30%, rgba(0,0,0,0) 50%, rgba(255,255,255,0.1) 70%, rgba(0,0,0,0.3) 100%);
    pointer-events: none; animation: lightSweep 5s ease-in-out infinite alternate;
  }
  @keyframes waveFlag { 0% { transform: rotateY(-15deg) rotateX(5deg) skewY(-2deg); } 100% { transform: rotateY(15deg) rotateX(-5deg) skewY(2deg); } }
  @keyframes lightSweep { 0% { transform: translateX(-20%); } 100% { transform: translateX(20%); } }
  .flag-3d svg { width: 100%; height: 100%; object-fit: cover; }

  .hero-badge {
    display: inline-block; padding: 6px 16px; border-radius: 30px;
    background: rgba(223,182,70,0.1); border: 1px solid var(--gold);
    color: var(--gold); font-size: 12px; font-weight: 800;
    letter-spacing: 1.5px; margin-bottom: 25px; text-transform: uppercase;
  }
  .hero h1 { font-size: clamp(32px, 6vw, 52px); font-weight: 800; line-height: 1.1; margin-bottom: 20px; color: #fff; }
  .hero h1 .gold-text { color: var(--gold); }
  .hero p.sub { font-size: clamp(16px, 2.5vw, 19px); color: var(--text-muted); max-width: 700px; margin: 0 auto 40px; }
  
  .btn {
    padding: 14px 28px; border-radius: 8px; font-weight: 600; font-size: 15px;
    text-decoration: none; cursor: pointer; border: none; transition: all 0.3s; display: inline-block;
  }
  .btn-primary { background: var(--cyan); color: #000; box-shadow: 0 4px 15px rgba(56,189,248,0.3); }
  .btn-primary:hover { background: #7dd3fc; }
  .btn-secondary { background: var(--glass); border: 1px solid var(--border-glass); color: var(--text-main); backdrop-filter: blur(5px); }
  .btn-secondary:hover { border-color: var(--text-muted); }

  /* SECCIONES BASE */
  section { padding: 50px 20px; max-width: 1000px; margin: 0 auto; }
  .sec-title { font-size: clamp(26px, 4vw, 36px); font-weight: 800; text-align: center; margin-bottom: 20px; color: var(--gold); line-height: 1.2; }
  .sec-subtitle { text-align:center; color:var(--text-muted); margin-bottom:40px; font-size:16px; max-width:750px; margin-left:auto; margin-right:auto; }
  
  .decision-box { text-align: center; max-width: 800px; margin: 0 auto; font-size: 18px; }
  .decision-box p { margin-bottom: 25px; }
  .text-cyan { color: var(--cyan); font-weight: 600; }

  /* NUEVA SECCIÓN: REVOLUCIÓN PEDAGÓGICA */
  .revolution-box { display: flex; flex-direction: column; gap: 20px; max-width: 900px; margin: 0 auto; }
  @media(min-width: 768px) { .revolution-box { flex-direction: row; } }
  .rev-column { flex: 1; padding: 30px 25px; border-radius: 16px; position: relative; }
  .rev-archaic { background: rgba(255, 61, 87, 0.05); border: 1px solid rgba(255, 61, 87, 0.3); }
  .rev-archaic h3 { color: var(--danger); margin-bottom: 15px; font-size: 20px; }
  .rev-erian { background: rgba(0, 229, 255, 0.05); border: 1px solid rgba(0, 229, 255, 0.3); }
  .rev-erian h3 { color: var(--cyan); margin-bottom: 15px; font-size: 20px; }
  .rev-column ul { list-style: none; }
  .rev-column ul li { margin-bottom: 12px; font-size: 14.5px; color: var(--text-muted); display: flex; gap: 10px; }
  .rev-archaic ul li::before { content: '✖'; color: var(--danger); font-weight: bold; }
  .rev-erian ul li::before { content: '✔'; color: var(--cyan); font-weight: bold; }

  /* ESTRATEGIA */
  .strategy-box { background: linear-gradient(135deg, rgba(223,182,70,0.08), rgba(11,19,32,0.5)); border: 1px solid var(--gold); border-radius: 16px; padding: 35px 25px; max-width: 850px; margin: 0 auto; text-align: center; position: relative; overflow: hidden; }
  .strategy-box::before { content: '👑'; position: absolute; top: -20px; right: -20px; font-size: 100px; opacity: 0.05; transform: rotate(15deg); }
  .strategy-box h3 { color: var(--gold); font-size: clamp(22px, 4vw, 28px); font-weight: 900; margin-bottom: 15px; line-height: 1.2; }
  .strategy-box p { font-size: 16px; color: var(--text-main); margin-bottom: 15px; text-align: left; }
  .strategy-box p strong { color: var(--cyan); }
  .strategy-secret { background: rgba(0,0,0,0.4); border-left: 4px solid var(--coral); padding: 15px 20px; border-radius: 8px; margin-top: 25px; text-align: left; }
  .strategy-secret p { font-size: 14px; color: var(--coral); margin: 0; font-weight: 600; }/* METAVERSO (CAMPUS VIRTUAL) */
.metaverse-container { max-width: 900px; margin: 0 auto; padding: 10px 0; perspective: 1200px; text-align: center; }
.metaverse-screen { background: radial-gradient(circle at center, #101c36 0%, #050810 100%); border: 2px solid rgba(56, 189, 248, 0.3); border-radius: 20px; padding: 40px 20px; position: relative; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(56,189,248,0.1); display: flex; justify-content: center; align-items: flex-end; gap: 20px; height: 380px; transform-style: preserve-3d; }
.metaverse-floor { position: absolute; bottom: 0; left: 0; right: 0; height: 150px; background-image: linear-gradient(rgba(56, 189, 248, 0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(56, 189, 248, 0.3) 1px, transparent 1px); background-size: 30px 30px; transform: rotateX(75deg); transform-origin: bottom; animation: moveFloor 2s linear infinite; z-index: 0; opacity: 0.5; }
@keyframes moveFloor { 0% { background-position: 0 0; } 100% { background-position: 0 30px; } }
.avatar-3d { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; animation: floatAvatar 3s ease-in-out infinite alternate; }
.avatar-3d:nth-child(3) { animation-delay: 0.5s; transform: scale(1.1) translateZ(50px); z-index: 3; }
.avatar-3d:nth-child(4) { animation-delay: 1s; }
@keyframes floatAvatar { 0% { transform: translateY(0px); } 100% { transform: translateY(-15px); } }
.avatar-3d:nth-child(3) { animation-name: floatAvatarCenter; }
@keyframes floatAvatarCenter { 0% { transform: translateY(0px) scale(1.1) translateZ(50px); } 100% { transform: translateY(-15px) scale(1.1) translateZ(50px); } }
.avatar-img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #38bdf8; box-shadow: 0 0 20px rgba(56,189,248,0.6); background: #000; }
.avatar-3d:nth-child(2) .avatar-img { border-color: #dfb646; box-shadow: 0 0 20px rgba(223,182,70,0.6); }
.voice-wave { display: flex; gap: 4px; margin-top: 15px; height: 20px; align-items: center; }
.voice-wave span { display: block; width: 4px; background: #38bdf8; border-radius: 2px; animation: wave 1s ease-in-out infinite; }
.avatar-3d:nth-child(2) .voice-wave span { background: #dfb646; animation-duration: 1.2s; }
.voice-wave span:nth-child(1) { height: 10px; animation-delay: 0.1s; }
.voice-wave span:nth-child(2) { height: 18px; animation-delay: 0.3s; }
.voice-wave span:nth-child(3) { height: 12px; animation-delay: 0.2s; }
.voice-wave span:nth-child(4) { height: 20px; animation-delay: 0.4s; }
.voice-wave span:nth-child(5) { height: 8px; animation-delay: 0.15s; }
@keyframes wave { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1.5); } }
.live-badge { position: absolute; top: 20px; left: 20px; z-index: 10; display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255, 61, 87, 0.5); font-size: 12px; font-weight: 800; color: #fff; }
.live-dot { width: 8px; height: 8px; background: #ff3d57; border-radius: 50%; animation: pulseLive 1s infinite; }
@keyframes pulseLive { 0% { opacity: 1; box-shadow: 0 0 10px #ff3d57; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

/* MOVILIDAD */
.mobility-grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
@media(min-width: 768px) { .mobility-grid { grid-template-columns: 1fr 1fr; } }
.mobility-card { position: relative; border-radius: 20px; overflow: hidden; border: 1px solid var(--border-glass); box-shadow: 0 15px 40px rgba(0,0,0,0.6); height: 400px; display: flex; align-items: flex-end; }
.mobility-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; filter: brightness(0.8); }
.mobility-card:hover img { transform: scale(1.05); filter: brightness(0.9); }
.mobility-overlay { position: relative; z-index: 2; width: 100%; background: linear-gradient(0deg, rgba(11,19,32,0.98) 0%, rgba(11,19,32,0.8) 60%, transparent 100%); padding: 35px 25px 25px; }
.mobility-overlay h4 { color: #fff; font-size: 22px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.mobility-overlay h4 span { font-size: 24px; }
.mobility-overlay p { color: var(--text-muted); font-size: 14.5px; line-height: 1.5; }

/* RUTA DE APRENDIZAJE INTERACTIVA */
.levels-grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 900px; margin: 0 auto; }
@media(min-width: 768px) { .levels-grid { grid-template-columns: 1fr 1fr; } }
.level-card { background: rgba(17, 28, 46, 0.4); border: 1px solid var(--border-glass); border-radius: 16px; padding: 25px; position: relative; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); overflow: hidden; backdrop-filter: blur(10px); }
.level-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--cyan); opacity: 0.5; transition: all 0.3s; }
.level-card:hover, .level-card.active { background: rgba(17, 28, 46, 0.9); border-color: var(--cyan); box-shadow: 0 10px 30px rgba(56,189,248,0.15); transform: translateY(-5px); }
.level-card:hover::before, .level-card.active::before { opacity: 1; width: 6px; background: var(--gold); }
.level-badge { display: inline-block; background: rgba(56,189,248,0.1); color: var(--cyan); font-weight: 800; font-size: 12px; padding: 6px 14px; border-radius: 20px; text-transform: uppercase; margin-bottom: 15px; border: 1px solid rgba(56,189,248,0.3); transition: all 0.3s; }
.level-card.active .level-badge { background: var(--gold); color: #000; border-color: var(--gold); }
.level-card h4 { color: #fff; margin-bottom: 10px; font-size: 20px; font-weight: 800; }
.level-card p { font-size: 14.5px; color: var(--text-muted); line-height: 1.6; }
.level-extra { max-height: 0; overflow: hidden; transition: max-height 0.4s ease, opacity 0.4s ease; opacity: 0; }
.level-card.active .level-extra { max-height: 150px; opacity: 1; margin-top: 15px; }
.level-extra p { font-size: 13px; color: var(--cyan); border-top: 1px solid var(--border-glass); padding-top: 15px; font-family: 'Courier New', monospace; }
.mastery-box { background: linear-gradient(135deg, rgba(223,182,70,0.1), transparent); border: 1px solid var(--gold); border-radius: 12px; padding: 30px; text-align: center; margin-top: 30px; }
.mastery-box h3 { color: var(--gold); font-size: 22px; margin-bottom: 10px; }
.mastery-box p { color: var(--text-main); font-size: 16px; font-weight: 500; }

/* IDIOMAS (AVATARES CIRCULARES) */
.lang-grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
@media(min-width: 768px) { .lang-grid { grid-template-columns: 1fr 1fr 1fr; } }
.lang-card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 16px; padding: 30px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; transition: all 0.4s; position: relative; overflow: hidden; }
.lang-card:hover { transform: translateY(-8px); border-color: var(--gold); box-shadow: 0 15px 40px rgba(0,0,0,0.6), inset 0 0 20px rgba(223,182,70,0.1); }
.lang-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--cyan), var(--gold)); }
.lang-avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid var(--cyan); box-shadow: 0 0 20px rgba(56,189,248,0.6); margin-bottom: 15px; background: #000; position: relative; z-index: 2; }
.lang-card:nth-child(1) .lang-avatar { border-color: #ff3d57; box-shadow: 0 0 25px rgba(255,61,87,0.6); }
.lang-card:nth-child(2) .lang-avatar { border-color: #ffd700; box-shadow: 0 0 25px rgba(255,215,0,0.6); }
.lang-card:nth-child(3) .lang-avatar { border-color: #38bdf8; box-shadow: 0 0 25px rgba(56,189,248,0.6); }
.lang-ring { position: absolute; top: 25px; width: 120px; height: 120px; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.3); animation: spin 10s linear infinite; z-index: 1; }
@keyframes spin { 100% { transform: rotate(360deg); } }
.lang-content h4 { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 8px; display: flex; justify-content: center; align-items: center; gap: 8px; }
.lang-content p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; min-height: 60px; }
.lang-price-tag { font-family: 'Courier New', monospace; font-size: 14px; font-weight: 800; color: var(--gold); background: rgba(223,182,70,0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(223,182,70,0.3); text-align: center; width: 100%; cursor: pointer; transition: all 0.3s; }
.lang-price-tag:hover { background: var(--gold); color: #000; }  /* 1,001 FORMAS (HUD TECNOLÓGICO) */
  .tech-grid { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 950px; margin: 0 auto; }
  @media(min-width: 768px) { .tech-grid { grid-template-columns: 1fr 1fr; } }
  .tech-card { background: rgba(17, 28, 46, 0.6); border: 1px solid var(--border-glass); border-left: 3px solid var(--cyan); padding: 22px; border-radius: 8px; display: flex; gap: 20px; align-items: flex-start; transition: background 0.3s; backdrop-filter: blur(5px); }
  .tech-card:hover { background: rgba(17, 28, 46, 0.9); border-left-color: var(--gold); }
  .tech-icon-svg { width: 32px; height: 32px; flex-shrink: 0; fill: var(--cyan); filter: drop-shadow(0 0 5px rgba(56,189,248,0.5)); }
  .tech-card:hover .tech-icon-svg { fill: var(--gold); filter: drop-shadow(0 0 5px rgba(223,182,70,0.5)); }
  .tech-info h4 { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 5px; font-family: 'Courier New', monospace; text-transform: uppercase; letter-spacing: 0.5px; }
  .tech-info p { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; }

  /* HARDWARE (LOGOS REALES) */
  .infra-grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
  @media(min-width: 768px) { .infra-grid { grid-template-columns: 1fr 1fr; } }
  .infra-card { background: var(--bg-card); border: 1px solid var(--border-glass); padding: 30px 25px; border-radius: 12px; text-align: center; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
  .infra-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--gold), var(--cyan)); }
  .brand-logo { height: 40px; width: auto; margin-bottom: 20px; fill: #fff; opacity: 0.8; }
  .infra-card h4 { color: #fff; margin-bottom: 10px; font-size: 18px; font-weight: 800; }
  .infra-card p { font-size: 13.5px; color: var(--text-muted); }

  /* CARRERAS MATRIX (SIMULACIÓN) */
  .matrix-section { position: relative; overflow: hidden; background: linear-gradient(180deg, rgba(11,19,32,0) 0%, rgba(0,255,65,0.02) 50%, rgba(11,19,32,0) 100%); }
  .matrix-grid { display: grid; grid-template-columns: 1fr; gap: 25px; max-width: 1050px; margin: 0 auto; position: relative; z-index: 2; }
  @media(min-width: 768px) { .matrix-grid { grid-template-columns: 1fr 1fr 1fr; } }
  .term-card { background: #050810; border: 1px solid rgba(0, 255, 65, 0.2); border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,255,65,0.05); transition: all 0.3s ease; display: flex; flex-direction: column; }
  .term-card:hover { border-color: var(--cyan); box-shadow: 0 15px 40px rgba(56, 189, 248, 0.2); transform: translateY(-5px); }
  .term-header { background: #0d1220; padding: 10px 15px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .term-dot { width: 10px; height: 10px; border-radius: 50%; }
  .term-dot.red { background: #ff5f56; } .term-dot.yellow { background: #ffbd2e; } .term-dot.green { background: #27c93f; }
  .term-title { color: #666; font-family: 'Courier New', monospace; font-size: 11px; margin-left: auto; }
  .term-body { padding: 20px; font-family: 'Courier New', Courier, monospace; font-size: 12px; line-height: 1.6; color: #a8b2c1; flex-grow: 1; position: relative; height: 220px; overflow-y: auto; }
  .term-body .line { margin-bottom: 4px; display: block; white-space: pre-wrap; }
  .term-body .line-num { color: #4a5568; display: inline-block; width: 20px; user-select: none; }
  .tag-cyan { color: var(--cyan); font-weight: bold; } .tag-gold { color: var(--gold); } .tag-green { color: #00ff41; } .tag-purple { color: #a78bfa; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: #00ff41; animation: blink 1s step-end infinite; vertical-align: middle; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .term-card::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 2
