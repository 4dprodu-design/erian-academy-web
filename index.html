<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erian Academy — La Llave del Imperio</title>
<meta name="description" content="La Universidad Privada de Barinas. Aprende inglés con IA y domina las carreras del futuro. Infraestructura de $100,000 USD para 300 personas.">
<style>
  :root {
    --bg-main: #0b1320;       
    --bg-card: #111c2e;       
    --bg-maroon: #3b1616;     
    --border-maroon: #642525;
    --gold: #dfb646;          
    --cyan: #38bdf8;          
    --coral: #fda4af;         
    --binance-yellow: #F0B90B;
    --text-main: #e2e8f0;     
    --text-muted: #94a3b8;    
    --glass: rgba(255,255,255,0.03);
    --border-glass: rgba(255,255,255,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background-color: var(--bg-main); 
    color: var(--text-main);
    overflow-x: hidden; line-height: 1.7;
    background-image: 
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 50px 50px;
  }

  /* ANIMACIONES DE SCROLL (Efecto App Premium) */
  .reveal {
    opacity: 0; transform: translateY(40px);
    transition: opacity 0.8s ease-out, transform 0.8s ease-out;
  }
  .reveal.active {
    opacity: 1; transform: translateY(0);
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    padding: 15px 20px;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(11, 19, 32, 0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-glass);
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
  .logo-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--gold); color: var(--bg-main);
    display: grid; place-items: center; font-size: 15px; font-weight: 900;
  }
  .header-cta {
    padding: 8px 14px; border-radius: 8px;
    background: transparent; border: 1px solid var(--gold);
    color: var(--gold); font-weight: 600; text-decoration: none; font-size: 12px;
    transition: all 0.3s; white-space: nowrap;
  }
  .header-cta:hover { background: var(--gold); color: var(--bg-main); }

  /* HERO */
  .hero { padding: 80px 20px 60px; text-align: center; max-width: 900px; margin: 0 auto; position: relative; }
  
  /* Bandera Americana Grande */
  .flag-container {
    display: inline-flex; align-items: center; justify-content: center;
    width: 80px; height: 50px; border-radius: 6px; overflow: hidden;
    margin-bottom: 25px; box-shadow: 0 0 20px rgba(255,255,255,0.1);
  }
  .flag-container svg { width: 100%; height: 100%; object-fit: cover; }

  .hero-badge {
    display: inline-block; padding: 6px 16px; border-radius: 30px;
    background: rgba(223,182,70,0.1); border: 1px solid var(--gold);
    color: var(--gold); font-size: 12px; font-weight: 800;
    letter-spacing: 1.5px; margin-bottom: 25px; text-transform: uppercase;
  }

  .hero h1 { font-size: clamp(32px, 6vw, 52px); font-weight: 800; line-height: 1.1; margin-bottom: 20px; color: #fff; }
  .hero h1 .gold-text { color: var(--gold); }
  .hero p.sub { font-size: clamp(16px, 2.5vw, 19px); color: var(--text-muted); max-width: 700px; margin: 0 auto 40px; }
  
  .btn {
    padding: 14px 28px; border-radius: 8px; font-weight: 600; font-size: 15px;
    text-decoration: none; cursor: pointer; border: none; transition: all 0.3s; display: inline-block;
  }
  .btn-primary { background: var(--cyan); color: #000; box-shadow: 0 4px 15px rgba(56,189,248,0.3); }
  .btn-primary:hover { background: #7dd3fc; }
  .btn-secondary { background: var(--glass); border: 1px solid var(--border-glass); color: var(--text-main); backdrop-filter: blur(5px); }
  .btn-secondary:hover { border-color: var(--text-muted); }

  /* SECCIONES */
  section { padding: 60px 20px; max-width: 1000px; margin: 0 auto; }
  .sec-title { font-size: clamp(26px, 4vw, 36px); font-weight: 800; text-align: center; margin-bottom: 20px; color: var(--gold); line-height: 1.2; }
  .sec-subtitle { text-align:center; color:var(--text-muted); margin-bottom:40px; font-size:16px; max-width:750px; margin-left:auto; margin-right:auto; }
  
  /* TEXTO DECISIÓN */
  .decision-box { text-align: center; max-width: 800px; margin: 0 auto; font-size: 18px; }
  .decision-box p { margin-bottom: 25px; }
  .text-cyan { color: var(--cyan); font-weight: 600; }

  /* ESTRATEGIA Y EXCLUSIVIDAD */
  .strategy-box {
    background: linear-gradient(135deg, rgba(223,182,70,0.08), rgba(11,19,32,0.5));
    border: 1px solid var(--gold); border-radius: 16px;
    padding: 35px 25px; max-width: 850px; margin: 0 auto; text-align: center;
    position: relative; overflow: hidden;
  }
  .strategy-box::before {
    content: '👑'; position: absolute; top: -20px; right: -20px;
    font-size: 100px; opacity: 0.05; transform: rotate(15deg);
  }
  .strategy-box h3 { color: var(--gold); font-size: clamp(22px, 4vw, 28px); font-weight: 900; margin-bottom: 15px; line-height: 1.2; }
  .strategy-box p { font-size: 16px; color: var(--text-main); margin-bottom: 15px; text-align: left; }
  .strategy-box p strong { color: var(--cyan); }
  .strategy-secret {
    background: rgba(0,0,0,0.4); border-left: 4px solid var(--coral);

  .strategy-secret p { font-size: 14px; color: var(--coral); margin: 0; font-weight: 600; }

  /* RUTA DE APRENDIZAJE */
  .levels-grid { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 900px; margin: 0 auto; }
  @media(min-width: 768px) { .levels-grid { grid-template-columns: 1fr 1fr; } }
  .level-card {
    background: var(--bg-card); border: 1px solid var(--border-glass);
    padding: 25px; border-radius: 12px; position: relative;
  }
  .level-badge {
    position: absolute; top: -12px; left: 20px;
    background: var(--gold); color: #000; font-weight: 800; font-size: 12px;
    padding: 4px 12px; border-radius: 20px; text-transform: uppercase;
  }
  .level-card h4 { color: var(--cyan); margin-top: 10px; margin-bottom: 10px; font-size: 18px; }
  .level-card p { font-size: 14px; color: var(--text-muted); }
  .mastery-box {
    background: linear-gradient(135deg, rgba(223,182,70,0.1), transparent);

  .mastery-box h3 { color: var(--gold); font-size: 22px; margin-bottom: 10px; }
  .mastery-box p { color: var(--text-main); font-size: 16px; font-weight: 500; }

  /* ESCUELA DE IDIOMAS */
  .lang-grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 900px; margin: 0 auto; }
  @media(min-width: 768px) { .lang-grid { grid-template-columns: 1fr 1fr 1fr; } }
  .lang-card {

  /* LAS 1,001 FORMAS */

  @media(min-width: 768px) { .method-grid { grid-template-columns: 1fr 1fr; } }
  .method-card {
    background: var(--bg-card); border: 1px solid var(--border-glass);

  .method-card p { color: var(--text-muted); font-size: 13px; line-height: 1.5; }

  /* INFRAESTRUCTURA */
  .infra-grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
  @media(min-width: 768px) { .infra-grid { grid-template-columns: 1fr 1fr; } }
  @media(min-width: 1024px) { .infra-grid { grid-template-columns: 1fr 1fr 1fr 1fr; } }
  .infra-card {
    background: var(--bg-card); border: 1px solid var(--border-glass);
    padding: 30px 20px; border-radius: 12px; text-align: center;
    position: relative; overflow: hidden;
  }
  .infra-card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--cyan));
  }
  .infra-card h4 { color: #fff; margin-bottom: 10px; font-size: 17px; font-weight: 800; }
  .infra-card p { font-size: 13px; color: var(--text-muted); }

  /* TIMELINE (Meses 9 al 12) */
  .timeline { display: grid; gap: 20px; max-width: 700px; margin: 0 auto; }
  .month-card {
    background: var(--bg-card); border: 1px solid var(--border-maroon);
    border-radius: 12px; overflow: hidden;
  }
  .month-header {
    background: var(--bg-maroon); padding: 12px; text-align: center;

  .month-body { padding: 24px; }

  .price-tag-small {
    font-size: 12px; color: var(--gold); background: rgba(223,182,70,0.1);

  .month-body p { color: var(--text-muted); font-size: 15px; }

  /* CONTADOR DE REGULARES */
  .regular-urgency {
    background: var(--bg-card); border: 1px solid rgba(56,189,248,0.3);
    border-radius: 12px; padding: 20px; max-width: 800px; margin: 0 auto 40px;
    text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);

  .regular-urgency p { color: var(--text-main); font-size: 15px; margin-bottom: 15px; font-weight: 700; }
  .regular-urgency p span { color: var(--cyan); }
  .regular-urgency .progress-bar { height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
  .regular-urgency .progress-fill { height: 100%; background: var(--cyan); width: 0%; transition: width 1s ease; box-shadow: 0 0 10px rgba(56,189,248,0.5); }

  /* PRECIOS */
  .pricing-grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 1050px; margin: 0 auto; }
  @media(min-width: 768px) { .pricing-grid { grid-template-columns: 1fr 1fr 1fr; } }
  .price-card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 16px; padding: 30px 20px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
  .price-card.premium { border-color: rgba(223,182,70,0.4); background: linear-gradient(180deg, rgba(223,182,70,0.05), var(--bg-card)); }
  .price-card.career { border-color: rgba(56,189,248,0.4); background: linear-gradient(180deg, rgba(56,189,248,0.05), var(--bg-card)); }
  .price-card h3 { font-size: 18px; color: #fff; margin-bottom: 10px; }
  .price-card.premium h3 { color: var(--gold); }

  .price-val { font-size: 38px; font-weight: 800; color: #fff; margin-bottom: 5px; }
  .price-val span { font-size: 14px; color: var(--text-muted); font-weight: 400; }
  .price-note { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; min-height: 36px; }
  .price-features { list-style: none; text-align: left; margin-bottom: 25px; font-size: 13px; display: grid; gap: 10px; color: var(--text-main); }
  .price-features li::before { content: '✓'; color: var(--cyan); margin-right: 8px; font-weight: bold; }
  .price-card.premium .price-features li::before { color: var(--gold); }
  
  .pricing-note {
    text-align: center; margin-top: 30px; background: rgba(255,255,255,0.03); 
    border: 1px dashed var(--border-glass); padding: 20px; border-radius: 12px;
    font-size: 14px; color: var(--text-muted);
  }
  .pricing-note strong { color: var(--gold); }

  /* NUEVA SECCIÓN PREMIUM DE BINANCE PAY */
  .binance-premium-card {
    max-width: 600px; margin: 40px auto 0;
    background: linear-gradient(145deg, #181a20, #0b0e11);
    border: 1px solid rgba(240, 185, 11, 0.3);
    border-radius: 20px; padding: 30px;
    text-align: center; position: relative; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(240,185,11,0.05);
  }
  .binance-premium-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, transparent, var(--binance-yellow), transparent);
  }
  .binance-logo {
    width: 60px; height: 60px; margin: 0 auto 15px;
    filter: drop-shadow(0 0 10px rgba(240,185,11,0.4));
  }
  .binance-premium-card h4 {
    color: #fff; font-size: 20px; font-weight: 800; margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .binance-premium-card p {
    color: var(--text-muted); font-size: 14px; margin-bottom: 0; line-height: 1.6;
  }
  .binance-premium-card p strong { color: var(--binance-yellow); }

  /* BECAS */
  .beca-container {
    background: linear-gradient(180deg, rgba(223,182,70,0.05) 0%, rgba(11,19,32,0) 100%);
    border: 1px solid rgba(223,182,70,0.3); border-radius: 16px; padding: 35px 25px;
    max-width: 700px; margin: 40px auto 0;
  }
  .beca-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .beca-top h2 { font-size: 24px; color: var(--gold); font-weight: 800; }
  .badge { padding: 6px 12px; border-radius: 20px; background: rgba(223,182,70,0.1); color: var(--gold); font-size: 12px; font-weight: 700; }
  
  .progress-wrap { margin: 20px 0 30px; }
  .progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .progress-fill { height: 100%; background: var(--gold); width: 0%; transition: width 1s ease; }
  .progress-text { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); }

  .req-list { list-style: none; display: grid; gap: 12px; margin-bottom: 30px; }
  .req-list li { background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px; font-size: 14px; border-left: 3px solid var(--gold); }

  /* FRASE FINAL, FOOTER Y CONTACTO */
  .final-quote { text-align: center; font-size: clamp(20px, 3vw, 28px); font-weight: 700; color: var(--coral); padding: 60px 20px 20px; line-height: 1.4; }
  
  .contact-section {
    text-align: center; background: var(--bg-card); border-top: 1px solid var(--border-glass);
    border-bottom: 1px solid var(--border-glass); padding: 40px 20px; margin-top: 40px;
  }
  .contact-section h3 { color: #fff; font-size: 20px; margin-bottom: 10px; }
  .contact-section p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
  .contact-email {

    color: var(--gold); font-size: 18px; font-weight: 700; padding: 12px 24px; border-radius: 8px;
    text-decoration: none; transition: all 0.3s;

  /* MODALES */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000; display: none; overflow-y: auto; padding: 20px; }
  .modal-overlay.active { display: flex; }

    border-radius: 16px; padding: 30px; max-width: 480px; width: 100%;
    margin: auto; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.5);

<body>index.html (Continuación)<script>
const CONFIG = {
  BECAS_TOTALES: 100,
  BECAS_ASIGNADAS: 12,
  REGULARES_TOTALES: 200,
  REGULARES_OCUPADOS: 33
};

function actualizarContadores() {
  // 1. Actualizar Becas
  const restantesBecas = Math.max(0, CONFIG.BECAS_TOTALES - CONFIG.BECAS_ASIGNADAS);
  const porcentajeBecas = Math.round((CONFIG.BECAS_ASIGNADAS / CONFIG.BECAS_TOTALES) * 100);

  const contadorBecas = document.getElementById('becaContador');
  const pctBecas = document.getElementById('becaPorcentaje');
  const fillBecas = document.getElementById('becaProgressFill');
  const estadoBeca = document.getElementById('becaEstado');
  const btnBeca = document.getElementById('btnPostularBeca');

  if (contadorBecas) {
    if (restantesBecas > 0) {
      contadorBecas.textContent = `Becas asignadas: ${CONFIG.BECAS_ASIGNADAS} / ${CONFIG.BECAS_TOTALES} · Quedan ${restantesBecas}`;
      estadoBeca.textContent = 'SELECCIÓN ACTIVA';
      btnBeca.disabled = false;
      btnBeca.style.opacity = '1';
    } else {
      contadorBecas.textContent = `Becas asignadas: ${CONFIG.BECAS_TOTALES} / ${CONFIG.BECAS_TOTALES} · CERRADAS`;
      estadoBeca.textContent = 'BECAS CERRADAS';
      estadoBeca.style.color = '#fda4af';
      estadoBeca.style.background = 'rgba(253,164,175,0.1)';
      btnBeca.disabled = true;
      btnBeca.style.opacity = '0.5';
      btnBeca.textContent = 'Becas Cerradas por este Año';
    }
    pctBecas.textContent = `${porcentajeBecas}%`;
    setTimeout(() => { fillBecas.style.width = `${porcentajeBecas}%`; }, 300);
  }

  // 2. Actualizar Regulares
  const porcentajeRegulares = Math.round((CONFIG.REGULARES_OCUPADOS / CONFIG.REGULARES_TOTALES) * 100);
  const fillRegulares = document.getElementById('regularProgressFill');
  if (fillRegulares) {
    setTimeout(() => { fillRegulares.style.width = `${porcentajeRegulares}%`; }, 300);
  }
}

function abrirModal(id) {
  const modal = document.getElementById(id);
  if (!modal) return;
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function cerrarModal(modal) {
  if (!modal) return;
  modal.classList.remove('active');
  document.body.style.overflow = '';
}

document.addEventListener('DOMContentLoaded', () => {
  // --- EFECTO DE SCROLL PREMIUM (Intersection Observer) ---
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('active');
        observer.unobserve(entry.target); // Solo animar una vez
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });

  reveals.forEach(reveal => observer.observe(reveal));

  // Mostrar alerta de éxito si viene de FormSubmit
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('exito') === 'true') {
    alert('¡Excelente! Tus datos han sido enviados correctamente. Nos pondremos en contacto contigo muy pronto.');
    window.history.replaceState({}, document.title, window.location.pathname);
  }

  actualizarContadores();

  const btnBeca = document.getElementById('btnPostularBeca');
  if (btnBeca) {
    btnBeca.addEventListener('click', () => {
      if ((CONFIG.BECAS_TOTALES - CONFIG.BECAS_ASIGNADAS) <= 0) {
        alert('Las becas de esta generación ya fueron asignadas.');
        return;
      }
      abrirModal('modalBeca');
    });
  }

  document.getElementById('btnReservarRegular')?.addEventListener('click', () => abrirModal('modalRegular'));
  document.getElementById('btnReservarElite')?.addEventListener('click', () => abrirModal('modalElite'));
  document.getElementById('btnReservarCarrera')?.addEventListener('click', () => abrirModal('modalCarrera'));

  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => cerrarModal(btn.closest('.modal-overlay')));
  });

  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) cerrarModal(overlay);
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay').forEach(m => cerrarModal(m));
    }
  });

  ['formBeca', 'formRegular', 'formElite', 'formCarrera'].forEach(formId => {
    const form = document.getElementById(formId);
    if (!form) return;
    form.addEventListener('submit', () => {
      const btn = form.querySelector('.form-submit');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Enviando...';
      }
    });
  });
});
</script>

</body>
</html>
