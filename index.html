<title>Erian Academy — Donde el Talento Importa Más que el Dinero</title>
<meta name="description" content="Ecosistema educativo élite de Barinas. 100 Becas de Excelencia + 200 cupos regulares. Solo 300 plazas.">
<style>
  :root {
    --bg: #050810;
    --bg2: #0a0f1e;
    --cyan: #00e5ff;
    --gold: #ffd700;
    --violet: #7c3aed;
    --glass: rgba(255,255,255,0.05);
    --glass-b: rgba(0,229,255,0.2);
    --text: #e8eaf0;
    --muted: #8892a8;
    --success: #00c853;
    --danger: #ff3d57;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    line-height: 1.6;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
    background-size: 44px 44px;
    z-index: -1;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 20% 10%, rgba(124,58,237,0.18), transparent 45%),
                radial-gradient(circle at 80% 90%, rgba(0,229,255,0.14), transparent 45%);
    z-index: -1;
    pointer-events: none;
  }

  /* === HEADER === */
  header {
    position: sticky; top: 0; z-index: 100;
    padding: 14px 22px;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(5,8,16,0.75);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(0,229,255,0.12);
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 900; font-size: 18px; letter-spacing: 2px;
  }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    display: grid; place-items: center;
    font-size: 16px; color: #000; font-weight: 900;
    box-shadow: 0 0 18px rgba(0,229,255,0.55);
  }
  .logo span { color: var(--cyan); }
  .header-cta {
    padding: 9px 18px; border-radius: 30px;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    color: #000; font-weight: 800; text-decoration: none;
    font-size: 13px; letter-spacing: 0.5px;
    transition: transform 0.2s;
  }
  .header-cta:active { transform: scale(0.95); }

  /* === HERO === */
  .hero {
    padding: 70px 22px 60px;
    text-align: center;
    max-width: 900px; margin: 0 auto;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 14px; border-radius: 30px;
    background: rgba(0,229,255,0.1);
    border: 1px solid rgba(0,229,255,0.35);
    color: var(--cyan); font-size: 11px; font-weight: 700;
    letter-spacing: 1.5px; margin-bottom: 24px;
  }
  .hero-badge::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.3; }
  }
  .hero h1 {
    font-size: clamp(30px, 7vw, 56px);
    font-weight: 900; line-height: 1.08;
    letter-spacing: -1.5px; margin-bottom: 20px;
  }
  .hero h1 .accent {
    background: linear-gradient(135deg, var(--cyan), var(--gold));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p.sub {
    font-size: clamp(14px, 2.4vw, 17px);
    color: var(--muted); max-width: 620px;
    margin: 0 auto 32px;
  }
  .hero-ctas {
    display: flex; gap: 12px; justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 15px 28px; border-radius: 14px;
    font-weight: 800; font-size: 14px; letter-spacing: 0.5px;
    text-decoration: none; cursor: pointer; border: none;
    transition: all 0.25s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    color: #000;
    box-shadow: 0 8px 30px rgba(0,229,255,0.35);
  }
  .btn-primary:active { transform: scale(0.97); }
  .btn-secondary {
    background: var(--glass);
    border: 1.5px solid var(--glass-b);
    color: var(--text);
  }
  .btn-secondary:active { transform: scale(0.97); }

  /* === STATS BAR === */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px; max-width: 760px; margin: 50px auto 0;
    padding: 0 22px;
  }
  .stat {
    background: var(--glass);
    border: 1px solid var(--glass-b);
    border-radius: 16px;
    padding: 20px 12px;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  .stat-num {
    font-size: 26px; font-weight: 900; color: var(--cyan);
    line-height: 1;
  }
  .stat-num.gold { color: var(--gold); }
  .stat-lbl {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1.5px;
    margin-top: 8px; font-weight: 700;
  }

  /* === SECTION BASE === */
  section {
    padding: 70px 22px;
    max-width: 1100px; margin: 0 auto;
  }
  .sec-tag {
    display: inline-block;
    font-size: 11px; font-weight: 800;
    letter-spacing: 2px; color: var(--cyan);
    margin-bottom: 12px;
  }
  .sec-tag.gold { color: var(--gold); }
  .sec-title {
    font-size: clamp(24px, 5vw, 38px);
    font-weight: 900; letter-spacing: -0.8px;
    margin-bottom: 14px; line-height: 1.15;
  }
  .sec-desc {
    font-size: 15px; color: var(--muted);
    max-width: 680px; margin-bottom: 34px;
  }

  /* === SECCIÓN BECAS === */
  .beca-card {
    background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(124,58,237,0.08));
    border: 1.5px solid rgba(255,215,0,0.35);
    border-radius: 22px;
    padding: 30px 24px;
    position: relative;
    overflow: hidden;
  }
  .beca-card::before {
    content: '';
    position: absolute; top: 0; right: 0;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(255,215,0,0.18), transparent 70%);
    pointer-events: none;
  }
  .beca-header {
    display: flex; justify-content: space-between;
    align-items: flex-start; gap: 14px;
    flex-wrap: wrap; margin-bottom: 20px;
    position: relative; z-index: 1;
  }
  .beca-title {
    font-size: 22px; font-weight: 900;
    color: var(--gold); letter-spacing: -0.5px;
  }
  .beca-badge {
    padding: 5px 12px; border-radius: 20px;
    background: rgba(255,215,0,0.15);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-size: 10px; font-weight: 800;
    letter-spacing: 1.5px;
    white-space: nowrap;
  }
  .beca-badge.closed {
    background: rgba(255,61,87,0.15);
    border-color: var(--danger);
    color: var(--danger);
  }
  .beca-progress-wrap {
    margin: 22px 0 16px;
    position: relative; z-index: 1;
  }
  .beca-progress-info {
    display: flex; justify-content: space-between;
    font-size: 12px; margin-bottom: 8px;
    font-weight: 700;
  }
  .beca-progress-info span:first-child { color: var(--gold); }
  .beca-progress-info span:last-child { color: var(--muted); }
  .progress-bar {
    height: 10px; background: rgba(255,255,255,0.08);
    border-radius: 10px; overflow: hidden;
    border: 1px solid rgba(255,215,0,0.25);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), #ff9500);
    border-radius: 10px;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 12px rgba(255,215,0,0.6);
  }
  .beca-criterios {
    display: grid; gap: 10px;
    margin-top: 24px;
    position: relative; z-index: 1;
  }
  .criterio {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 14px;
    background: rgba(0,0,0,0.25);
    border-radius: 12px;
    border-left: 3px solid var(--gold);
  }
  .criterio-num {
    flex-shrink: 0;
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,215,0,0.15);
    color: var(--gold);
    display: grid; place-items: center;
    font-size: 12px; font-weight: 900;
  }
  .criterio-body strong {
    color: var(--gold); font-size: 13px;
    display: block; margin-bottom: 2px;
  }
  .criterio-body span {
    font-size: 12px; color: var(--muted); line-height: 1.4;
  }
  .beca-cta {
    margin-top: 22px; position: relative; z-index: 1;
    width: 100%; padding: 14px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), #ff9500);
    color: #000; font-weight: 900;
    font-size: 14px; border: none; cursor: pointer;
    letter-spacing: 0.5px;
    transition: transform 0.2s;
  }
  .beca-cta:active { transform: scale(0.97); }
  .beca-cta:disabled {
    background: rgba(255,255,255,0.08);
    color: var(--muted); cursor: not-allowed;
    box-shadow: none;
  }

  /* === SECCIÓN PRECIO REGULAR === */
  .precio-card {
    background: linear-gradient(160deg, rgba(0,229,255,0.08), rgba(124,58,237,0.06));
    border: 1.5px solid rgba(0,229,255,0.3);
    border-radius: 22px;
    padding: 32px 24px;
    text-align: center;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }
  .precio-card::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 22px;
    padding: 1.5px;
    background: linear-gradient(135deg, var(--cyan), transparent, var(--violet));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .precio-tag {
    display: inline-block;
    padding: 5px 14px; border-radius: 20px;
    background: rgba(0,229,255,0.15);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-size: 10px; font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 18px;
  }
  .precio-amount {
    font-size: 54px; font-weight: 900;
    letter-spacing: -2px; line-height: 1;
    color: var(--cyan);
  }
  .precio-amount sup {
    font-size: 22px; vertical-align: super;
    font-weight: 700; margin-right: 3px;
  }
  .precio-amount small {
    font-size: 16px; font-weight: 600;
    color: var(--muted); letter-spacing: 0;
  }
  .precio-desc {
    font-size: 13px; color: var(--muted);
    margin: 10px 0 22px;
  }
  .precio-features {
    text-align: left;
    display: grid; gap: 9px;
    margin-bottom: 24px;
    padding: 0 8px;
  }
  .precio-features li {
    display: flex; gap: 10px;
    font-size: 13px; list-style: none;
  }
  .precio-features li::before {
    content: '✓';
    flex-shrink: 0;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(0,229,255,0.15);
    color: var(--cyan);
    display: grid; place-items: center;
    font-size: 12px; font-weight: 900;
  }
  .precio-inscripcion {
    font-size: 11px; color: var(--muted);
    background: rgba(0,0,0,0.3);
    padding: 10px 14px; border-radius: 10px;
    margin-bottom: 18px;
  }
  .precio-inscripcion strong { color: var(--gold); }
  .precio-cta {
    width: 100%; padding: 15px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    color: #000; font-weight: 900;
    font-size: 14px; border: none; cursor: pointer;
    letter-spacing: 0.5px;
    transition: transform 0.2s;
  }

    font-size: 12px; color: var(--muted); line-height: 1.4;
  }
  .beca-cta {
    margin-top: 22px; position: relative; z-index: 1;
    width: 100%; padding: 14px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), #ff9500);
    color: #000; font-weight: 900;
    font-size: 14px; border: none; cursor: pointer;
    letter-spacing: 0.5px;
    transition: transform 0.2s;
  }
  .beca-cta:active { transform: scale(0.97); }
  .beca-cta:disabled {
    background: rgba(255,255,255,0.08);
    color: var(--muted); cursor: not-allowed;
    box-shadow: none;
  }

  /* === SECCIÓN PRECIO REGULAR === */
  .precio-card {
    background: linear-gradient(160deg, rgba(0,229,255,0.08), rgba(124,58,237,0.06));
    border: 1.5px solid rgba(0,229,255,0.3);
    border-radius: 22px;
    padding: 32px 24px;
    text-align: center;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }
  .precio-card::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 22px;
    padding: 1.5px;
    background: linear-gradient(135deg, var(--cyan), transparent, var(--violet));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .precio-tag {
    display: inline-block;
    padding: 5px 14px; border-radius: 20px;
    background: rgba(0,229,255,0.15);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-size: 10px; font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 18px;
  }
  .precio-amount {
    font-size: 54px; font-weight: 900;
    letter-spacing: -2px; line-height: 1;
    color: var(--cyan);
  }
  .precio-amount sup {
    font-size: 22px; vertical-align: super;
    font-weight: 700; margin-right: 3px;
  }
  .precio-amount small {
    font-size: 16px; font-weight: 600;
    color: var(--muted); letter-spacing: 0;
  }
  .precio-desc {
    font-size: 13px; color: var(--muted);
    margin: 10px 0 22px;
  }
  .precio-features {
    text-align: left;
    display: grid; gap: 9px;
    margin-bottom: 24px;
    padding: 0 8px;
  }
  .precio-features li {
    display: flex; gap: 10px;
    font-size: 13px; list-style: none;
  }
  .precio-features li::before {
    content: '✓';
    flex-shrink: 0;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(0,229,255,0.15);
    color: var(--cyan);
    display: grid; place-items: center;
    font-size: 12px; font-weight: 900;
  }
  .precio-inscripcion {
    font-size: 11px; color: var(--muted);
    background: rgba(0,0,0,0.3);
    padding: 10px 14px; border-radius: 10px;
    margin-bottom: 18px;
  }
  .precio-inscripcion strong { color: var(--gold); }
  .precio-cta {
    width: 100%; padding: 15px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    color: #000; font-weight: 900;
    font-size: 14px; border: none; cursor: pointer;
    letter-spacing: 0.5px;
    transition: transform 0.2s;
  }
  .precio-cta:active { transform: scale(0.97); }
