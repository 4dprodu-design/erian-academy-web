    background-size: 44px 44px;
    z-index: -1; pointer-events: none;

  body::after {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(circle at 20% 10%, rgba(124,58,237,0.18), transparent 45%),

    border-bottom: 1px solid rgba(0,229,255,0.12);

  .logo-mark {

    box-shadow: 0 0 18px rgba(0,229,255,0.55);

  .logo span { color: var(--cyan); }
  .header-cta {
    padding: 9px 18px; border-radius: 30px;

  .header-cta:active { transform: scale(0.95); }
  .hero {
    padding: 70px 22px 60px; text-align: center;

  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 7px;

  }
  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.3; }

    font-size: clamp(30px, 7vw, 56px);
    font-weight: 900; line-height: 1.08;
    letter-spacing: -1.5px; margin-bottom: 20px;
  }
  .hero h1 .accent {
    background: linear-gradient(135deg, var(--cyan), var(--gold));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;

<script>
const CONFIG = {
  BECAS_TOTALES: 100,
  BECAS_ASIGNADAS: 0,
  CUPOS_TOTALES: 300,
  CUPOS_OCUPADOS: 0,
  PRECIO_BECA: 69.99,
  PRECIO_REGULAR: 99.99
};

function actualizarContadorBecas() {
  const { BECAS_TOTALES, BECAS_ASIGNADAS } = CONFIG;
  const restantes = Math.max(0, BECAS_TOTALES - BECAS_ASIGNADAS);
  const porcentaje = Math.round((BECAS_ASIGNADAS / BECAS_TOTALES) * 100);

  const contador = document.getElementById('becaContador');
  const pct = document.getElementById('becaPorcentaje');
  const fill = document.getElementById('becaProgressFill');
  const estado = document.getElementById('becaEstado');
  const btnBeca = document.getElementById('btnPostularBeca');

  if (!contador) return;

  if (restantes > 0) {
    contador.textContent = `Becas asignadas: ${BECAS_ASIGNADAS} / ${BECAS_TOTALES} · Quedan ${restantes}`;
    estado.textContent = 'SELECCIÓN ACTIVA';
    estado.className = 'beca-badge';
    btnBeca.disabled = false;
    btnBeca.textContent = 'Postular a mi Hijo para Beca →';
  } else {
    contador.textContent = `Becas asignadas: ${BECAS_TOTALES} / ${BECAS_TOTALES} · CERRADAS`;
    estado.textContent = 'BECAS CERRADAS';
    estado.className = 'beca-badge closed';
    btnBeca.disabled = true;
    btnBeca.textContent = '🔒 Becas de Esta Generación: Cerradas';
  }

  pct.textContent = `${porcentaje}%`;
  setTimeout(() => { fill.style.width = `${porcentaje}%`; }, 300);
}

function abrirModal(id) {
  const modal = document.getElementById(id);
  if (!modal) return;
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function cerrarModal(modal) {
  if (!modal) return;
  modal.classList.remove('active');
  document.body.style.overflow = '';
}

function cerrarTodosLosModales() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
  document.body.style.overflow = '';
}

document.addEventListener('DOMContentLoaded', () => {
  actualizarContadorBecas();

  const btnBeca = document.getElementById('btnPostularBeca');
  if (btnBeca) {
    btnBeca.addEventListener('click', () => {
      const restantes = CONFIG.BECAS_TOTALES - CONFIG.BECAS_ASIGNADAS;
      if (restantes <= 0) {
        alert('Las becas de esta generación han sido cerradas. Puedes reservar un cupo regular o esperar a la próxima convocatoria.');
        return;
      }
      abrirModal('modalBeca');
    });
  }

  const btnRegular = document.getElementById('btnReservarRegular');
  if (btnRegular) {
    btnRegular.addEventListener('click', () => abrirModal('modalRegular'));
  }

  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => {
      const modal = btn.closest('.modal-overlay');
      cerrarModal(modal);
    });
  });

  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) cerrarModal(overlay);
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') cerrarTodosLosModales();
  });

  const revealElements = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    revealElements.forEach(el => observer.observe(el));
  } else {
    revealElements.forEach(el => el.classList.add('visible'));
  }

  document.querySelectorAll('a[href^="#"]').forEach(link => {
    link.addEventListener('click', (e) => {
      const target = document.querySelector(link.getAttribute('href'));
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

  ['formBeca', 'formRegular'].forEach(formId => {
    const form = document.getElementById(formId);
    if (!form) return;
    form.addEventListener('submit', () => {
      const btn = form.querySelector('.form-submit');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Enviando...';
      }
    });
  });
});

window.actualizarBecas = function(n) {
  CONFIG.BECAS_ASIGNADAS = Math.min(n, CONFIG.BECAS_TOTALES);
  actualizarContadorBecas();
  console.log(`✅ Becas actualizadas: ${CONFIG.BECAS_ASIGNADAS}/${CONFIG.BECAS_TOTALES}`);
};

window.actualizarCupos = function(n) {
  CONFIG.CUPOS_OCUPADOS = Math.min(n, CONFIG.CUPOS_TOTALES);
  console.log(`✅ Cupos actualizados: ${CONFIG.CUPOS_OCUPADOS}/${CONFIG.CUPOS_TOTALES}`);
};
</script>
